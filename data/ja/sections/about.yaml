# a summary about you
summary: |
  2023年に東京農工大学工学部知能情報システム工学科を卒業．2025年に同大学大学院工学府博士前期課程を修了．現在は大阪大学大学院工学研究科の博士後期課程に在籍．2025年より日本学術振興会 特別研究員（DC1）．グラフ信号処理，信号処理のための機械学習，解釈可能な深層学習に関する研究に従事．

