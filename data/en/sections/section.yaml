section:
  name: Featured Posts # Title of section (default: "")
  id: featured-posts # url id/slug of section *Required*
  enable: true # Boolean to determine if this section is enabled (default: false)
  weight: 3 # Order to display section in (default: alphabetical followed by weight)
  showOnNavbar: true
  hideTitle: false

# posts to feature
# Note: 2024-pcsj-imps and 2023-sirius-extension are Japanese-only (index.ja.md),
# so they are featured on the Japanese site only (see data/ja/sections/section.yaml).
posts:
  - publications